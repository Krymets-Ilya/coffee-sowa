name: Optimize Coffee Sova images

on:
  push:
    branches:
      - optimize-site-v2
    paths:
      - .github/workflows/optimize-images.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: optimize-site-v2
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Convert heavy PNG assets to WebP
        run: |
          set -euxo pipefail

          echo 'Original assets:'
          identify assets/coffee-love-hq.png assets/coffee-menu-background.png assets/coffee-sova-owl-faded-longtop.png
          ls -lh assets/*.png

          # Resize only when an asset exceeds the real rendering envelope.
          convert assets/coffee-love-hq.png -resize '1400x1400>' -strip /tmp/coffee-love.png
          cwebp -quiet -q 84 -m 6 -metadata none /tmp/coffee-love.png -o assets/coffee-love-hq.webp

          convert assets/coffee-menu-background.png -resize '1920x1920>' -strip /tmp/coffee-menu.png
          cwebp -quiet -q 82 -m 6 -metadata none /tmp/coffee-menu.png -o assets/coffee-menu-background.webp

          convert assets/coffee-sova-owl-faded-longtop.png -resize '1600x1600>' -strip /tmp/coffee-owl.png
          cwebp -quiet -q 86 -alpha_q 100 -m 6 -metadata none /tmp/coffee-owl.png -o assets/coffee-sova-owl-faded-longtop.webp

          echo 'Optimized assets:'
          identify assets/*.webp
          ls -lh assets/*.webp

      - name: Switch site references to WebP
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('coffee-sova-owl-faded-longtop.png', 'coffee-sova-owl-faded-longtop.webp')
          html = html.replace('coffee-love-hq.png', 'coffee-love-hq.webp')
          index.write_text(html, encoding='utf-8')

          css = Path('assets/site.css')
          text = css.read_text(encoding='utf-8')
          text = text.replace('coffee-menu-background.png', 'coffee-menu-background.webp')
          css.write_text(text, encoding='utf-8')
          PY

      - name: Remove superseded PNG assets and workflow
        run: |
          git rm assets/coffee-love-hq.png assets/coffee-menu-background.png assets/coffee-sova-owl-faded-longtop.png
          git rm .github/workflows/optimize-images.yml

      - name: Verify references and size reduction
        run: |
          set -euxo pipefail
          ! grep -R --line-number -E 'coffee-love-hq\.png|coffee-menu-background\.png|coffee-sova-owl-faded-longtop\.png' index.html assets/site.css
          test -s assets/coffee-love-hq.webp
          test -s assets/coffee-menu-background.webp
          test -s assets/coffee-sova-owl-faded-longtop.webp
          du -h assets/coffee-love-hq.webp assets/coffee-menu-background.webp assets/coffee-sova-owl-faded-longtop.webp

      - name: Commit optimized assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site.css assets/*.webp
          git commit -m 'Optimize Coffee Sova image assets'
          git push origin HEAD:optimize-site-v2
